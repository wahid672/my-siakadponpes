services:
  siakadponpes:
    image: ghcr.io/wahid672/my-siakadponpes:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siakadponpes-app
    restart: unless-stopped
    ports:
      - "${PORT:-4400}:4400"
    environment:
      - NODE_ENV=production
      - PORT=4400
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/siakad.db
      - APP_URL=${APP_URL:-http://localhost:4400}
      
      # Tripay Payment Gateway Configuration
      - TRIPAY_MODE=${TRIPAY_MODE:-sandbox}
      - TRIPAY_MERCHANT_CODE=${TRIPAY_MERCHANT_CODE:-T10469}
      - TRIPAY_API_KEY=${TRIPAY_API_KEY:-DEV-WqLYW5qy3V6x6BAyZbb60xkJLmYXz0cPJAqwM6qj}
      - TRIPAY_PRIVATE_KEY=${TRIPAY_PRIVATE_KEY:-LX5le-rAseG-TkHmJ-KWo8a-inGpR}

      # SMTP Server Configuration (Gmail / Custom SMTP)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-admin@siakadponpes.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-SIAKAD PONPES}
    volumes:
      # Persistent storage volume for SQLite database (siakad.db)
      - ./data:/app/data
    networks:
      - default
      - caddy_net

networks:
  caddy_net:
    external: true
