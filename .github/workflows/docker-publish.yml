name: Build & Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'version.txt'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from version.txt
        id: version_step
        run: |
          VERSION=$(cat version.txt | tr -d '\r' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "Error: version.txt is empty!"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # GHCR requires lowercase image names
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$REPO_LOWER" >> $GITHUB_OUTPUT
          
          echo "Building image version: $VERSION"
          echo "Target registry: ghcr.io/$REPO_LOWER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.version_step.outputs.IMAGE_NAME }}:${{ steps.version_step.outputs.VERSION }}
            ${{ steps.version_step.outputs.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
